[project]
name = "soccergambling"
version = "0.1.0"
description = "Generate Excel files for soccer betting records"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.0",
    "playwright>=1.40.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
generate-browser-template = "browser_bet_scraper:main"
web-app = "web_app:main"
launcher = "launcher:main"

[tool.setuptools]
py-modules = ["web_app", "launcher", "browser_bet_scraper"]

[tool.uv]
package = true
